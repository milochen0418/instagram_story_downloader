[tool.poetry]
name = "mistories"
version = "0.1.0"
description = "MiStories — back up your Instagram Stories, built with Reflex"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
# <3.16 cap: verified up to 3.15.
python = ">=3.11,<3.16"
reflex = "0.10.0"
yt-dlp = "*"
playwright = "^1.59.0"
requests = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
